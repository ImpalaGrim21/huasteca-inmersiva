name: Deploy Huasteca to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /huasteca-inmersiva/
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Prepare browser for acceptance checks
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "E2E_BROWSER_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps --only-shell chromium
          fi

      - name: Verify skills, build and acceptance flows
        run: npm run verify

      - name: Save bounded failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-failure
          path: |
            .work/qa/latest/
            .work/metrored-prototype/qa/
            .work/metrored-next/journey-e2e/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
